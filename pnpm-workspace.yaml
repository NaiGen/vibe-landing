# pnpm по умолчанию отклоняет пакеты, «опубликованные» совсем недавно — защита
# от свежезалитых вредоносных версий. Next 16.3.2 и его @next/swc-* попали под
# это правило: без списка ниже `pnpm install`/`pnpm dev` падают с
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION; когда пакеты состарятся, список станет декоративным.
minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2
